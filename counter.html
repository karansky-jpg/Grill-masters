<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grill Masters - Live Kitchen Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6 font-sans">

    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center border-b border-slate-700 pb-4 mb-6">
            <h1 class="text-2xl font-bold text-amber-400 tracking-wider">👑 GRILL MASTERS LIVE KITCHEN</h1>
            <span class="bg-green-500 text-slate-950 font-bold px-3 py-1 rounded-full text-xs animate-pulse">LIVE CONNECTED</span>
        </header>

        <div id="live-orders-container" class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="col-span-3 text-center py-12 text-slate-500">Waiting for first royal order...</div>
        </div>
    </div>

    <audio id="bell-sound" src="https://assets.mixkit.co/active_storage/sfx/911/911-200.wav" preload="auto"></audio>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCR72F9nFf8awxsBJG11xO7mHNGIdiXcpE",
            authDomain: "menu-5e048.firebaseapp.com",
            projectId: "menu-5e048",
            storageBucket: "menu-5e048.firebasestorage.app",
            messagingSenderId: "429776931303",
            appId: "1:429776931303:web:688dab79bd2753cc0c9542"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let firstLoad = true;

        // Real-time Event Snapshot Listener
        db.collection("live_orders").orderBy("timestamp", "desc")
        .onSnapshot((snapshot) => {
            const container = document.getElementById("live-orders-container");
            container.innerHTML = "";

            if (snapshot.empty) {
                container.innerHTML = `<div class="col-span-3 text-center py-12 text-slate-500">No active orders right now.</div>`;
                return;
            }

            if (!firstLoad && snapshot.docChanges().some(change => change.type === "added")) {
                document.getElementById("bell-sound").play().catch(e => console.log("Sound alert ready."));
            }
            firstLoad = false;

            snapshot.forEach((doc) => {
                const order = doc.data();
                const orderId = doc.id;

                let itemsHtml = "";
                order.items.forEach(item => {
                    itemsHtml += `<li class="flex justify-between text-sm py-1.5 border-b border-slate-700/50">
                        <span>${item.name} <b class="text-amber-400">x${item.qty}</b></span>
                        <span class="font-semibold text-slate-300">₹${item.price * item.qty}</span>
                    </li>`;
                });

                const card = `
                    <div class="bg-slate-800 border-2 ${order.status === 'Completed' ? 'border-green-600 opacity-50' : 'border-amber-500'} p-5 rounded-xl shadow-2xl flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-center mb-3">
                                <span class="text-xs text-slate-400 font-mono">Order: ...${orderId.slice(-6)}</span>
                                <span class="px-2.5 py-0.5 rounded text-[10px] font-bold uppercase ${order.status === 'Pending' ? 'bg-amber-500/20 text-amber-400' : 'bg-green-500/20 text-green-400'}">${order.status}</span>
                            </div>
                            <ul class="text-slate-300 space-y-1 mb-4">${itemsHtml}</ul>
                        </div>
                        <div class="border-t border-slate-700 pt-3 mt-2">
                            <div class="flex justify-between font-bold text-base text-slate-200 mb-4">
                                <span>Total (with GST):</span>
                                <span class="text-emerald-400 text-lg">₹${order.grandTotal.toFixed(0)}</span>
                            </div>
                            ${order.status === 'Pending' ? 
                              `<button onclick="completeOrder('${orderId}')" class="w-full py-2.5 bg-green-500 hover:bg-green-600 text-slate-950 font-bold text-xs uppercase tracking-wider rounded-lg transition">✓ Clear Order (Done)</button>` : 
                              `<div class="text-center py-2 text-xs bg-slate-900 text-green-400 font-bold rounded-lg">Served ✓</div>`
                            }
                        </div>
                    </div>`;
                container.innerHTML += card;
            });
        });

        function completeOrder(id) {
            db.collection("live_orders").doc(id).update({ status: "Completed" });
        }
    </script>
</body>
</html>
