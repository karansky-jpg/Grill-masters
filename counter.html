<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grill Masters - Live Kitchen Dashboard</title>
    <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6 font-sans">

    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center border-b border-slate-800 pb-4 mb-6">
            <div class="flex items-center gap-3">
                <span class="text-amber-400 text-3xl">👑</span>
                <h1 class="text-2xl font-bold tracking-widest text-amber-400 font-serif">GRILL MASTERS KITCHEN PANEL</h1>
            </div>
            <span class="bg-emerald-500 text-slate-950 font-bold px-4 py-1.5 rounded-full text-xs animate-pulse tracking-wider">LIVE DATA FEED</span>
        </header>

        <!-- Realtime dynamic grid stream container -->
        <div id="live-orders-container" class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="col-span-3 text-center py-20 text-slate-600 tracking-wider">Waiting for first royal order from tables...</div>
        </div>
    </div>

    <!-- Alert Ring Sound Notification System -->
    <audio id="bell-sound" src="[https://assets.mixkit.co/active_storage/sfx/911/911-200.wav](https://assets.mixkit.co/active_storage/sfx/911/911-200.wav)" preload="auto"></audio>

    <!-- Firebase Compat Modules Core scripts -->
    <script src="[https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js](https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js)"></script>
    <script src="[https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js](https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js)"></script>

    <script>
        // AAPKA ACCURATE FIREBASE CONFIGURATION BOX
        const firebaseConfig = {
          apiKey: "AIzaSyCR72F9nFf8awxsBJG11xO7mHNGIdiXcpE",
          authDomain: "menu-5e048.firebaseapp.com",
          projectId: "menu-5e048",
          storageBucket: "menu-5e048.firebasestorage.app",
          messagingSenderId: "429776931303",
          appId: "1:429776931303:web:688dab79bd2753cc0c9542"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let firstLoad = true;

        // Realtime collection data listeners setup
        db.collection("live_orders").orderBy("timestamp", "desc")
        .onSnapshot((snapshot) => {
            const container = document.getElementById("live-orders-container");
            container.innerHTML = "";

            if (snapshot.empty) {
                container.innerHTML = `<div class="col-span-3 text-center py-20 text-slate-600">No active table orders present.</div>`;
                return;
            }

            // Play clean ring sound on incoming items packet add event
            if (!firstLoad && snapshot.docChanges().some(change => change.type === "added")) {
                document.getElementById("bell-sound").play().catch(e => console.log("Sound enabled."));
            }
            firstLoad = false;

            snapshot.forEach((doc) => {
                const order = doc.data();
                const orderId = doc.id;

                let itemsListHtml = "";
                order.items.forEach(item => {
                    itemsListHtml += `
                        <li class="flex justify-between items-center text-sm py-2 border-b border-slate-800/40">
                            <span class="text-slate-300 font-medium">${item.name} <b class="text-amber-400 bg-amber-400/10 px-1.5 py-0.5 rounded text-xs ml-1">x${item.qty}</b></span>
                            <span class="text-slate-400 font-mono">₹${item.price * item.qty}</span>
                        </li>`;
                });

                const status = order.status || "Pending";
                const isCompleted = status === 'Completed';

                let statusBadgeColor = "bg-amber-500/20 text-amber-400";
                if (status === "Preparing") statusBadgeColor = "bg-blue-500/20 text-blue-400 animate-pulse";
                if (status === "Served") statusBadgeColor = "bg-purple-500/20 text-purple-400";
                if (status === "Completed") statusBadgeColor = "bg-emerald-500/20 text-emerald-400";

                const cardHtml = `
                    <div class="bg-slate-900 border-2 ${isCompleted ? 'border-emerald-600/40 opacity-40' : 'border-amber-500'} p-5 rounded-2xl flex flex-col justify-between shadow-2xl transition hover:scale-[1.01]">
                        <div>
                            <div class="flex justify-between items-center mb-4">
                                <span class="bg-amber-400 text-slate-950 font-bold px-3 py-1 rounded-lg text-sm font-mono">TABLE ${order.tableNumber}</span>
                                <span class="px-2.5 py-0.5 rounded text-[10px] font-bold tracking-widest uppercase ${statusBadgeColor}">${status}</span>
                            </div>
                            
                            ${order.specialInstructions ? `<div class="bg-red-500/10 border-l-4 border-red-500 p-2 text-xs text-red-400 mb-3 rounded-r font-mono">💡 Notes: ${order.specialInstructions}</div>` : ""}

                            <ul class="divide-y divide-slate-800/40 mb-4">${itemsListHtml}</ul>
                        </div>

                        <div class="border-t border-slate-800/80 pt-3 mt-2">
                            <div class="flex justify-between items-center font-bold text-slate-200 mb-4 font-mono">
                                <span>TOTAL BILL:</span>
                                <span class="text-xl text-emerald-400">₹${order.grandTotal}</span>
                            </div>
                            <div class="space-y-2">
                                ${status === 'Pending' ? 
                                    `<button onclick="updateStatus('${orderId}', 'Preparing')" class="w-full py-2.5 bg-blue-500 hover:bg-blue-600 text-slate-950 font-bold text-xs uppercase tracking-widest rounded-xl transition">👨‍🍳 Start Cooking</button>` : ''
                                }
                                ${status === 'Preparing' ? 
                                    `<button onclick="updateStatus('${orderId}', 'Served')" class="w-full py-2.5 bg-purple-500 hover:bg-purple-600 text-white font-bold text-xs uppercase tracking-widest rounded-xl transition">🚚 Serve to Table</button>` : ''
                                }
                                ${status === 'Served' ? 
                                    `<button onclick="updateStatus('${orderId}', 'Completed')" class="w-full py-2.5 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold text-xs uppercase tracking-widest rounded-xl transition">✓ Clear Order (Paid)</button>` : ''
                                }
                                ${isCompleted ? 
                                    `<div class="text-center py-2.5 text-xs bg-slate-950 text-emerald-400 font-bold rounded-xl border border-emerald-500/30">Served & Completed ✓</div>` : ''
                                }
                            </div>
                        </div>
                    </div>`;
                container.innerHTML += cardHtml;
            });
        }, error => console.error("Database sync drop context:", error));

        function updateStatus(id, newStatus) {
            db.collection("live_orders").doc(id).update({ status: newStatus });
        }
    </script>
</body>
</html>

```
